name: PR Check

# 触发：PR（社区贡献）+ 直推 main（作者流程，见下方豁免说明）
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 作者豁免：BG4JTS（作者/维护者）与 oneinitAI（组织/机器人账号）的提交
# （直推或自提 PR）跳过检查，加速单人维护节奏；其他贡献者的 PR 执行全量检查。
# 注意：status 总闸保持 always()，被跳过的 job 视为通过（result = skipped）。

env:
  CARGO_TERM_COLOR: always

# 同一 ref 的新提交取消旧 run，避免并行浪费
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================
  # 分类 job：计算体量分级 (S/M/L) 和 label 类型
  # ============================================================
  meta:
    name: Classify PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.meta.outputs.tier }}
      docs_only: ${{ steps.meta.outputs.docs_only }}
      ci_only: ${{ steps.meta.outputs.ci_only }}
    steps:
      - id: meta
        run: |
          FILES=${{ github.event.pull_request.changed_files }}

          # 体量分级：S ≤10 文件，M 11-30，L >30
          TIER=S
          if [ "$FILES" -gt 10 ] && [ "$FILES" -le 30 ]; then TIER=M; fi
          if [ "$FILES" -gt 30 ]; then TIER=L; fi

          # label 覆盖：breaking 强制全量检查
          LABELS="${{ join(github.event.pull_request.labels.*.name, ',') }}"
          case ",$LABELS," in
            *,breaking,*) TIER=L ;;
          esac

          echo "tier=$TIER" >> "$GITHUB_OUTPUT"

          # label: docs — 仅文档，跳过编译
          case ",$LABELS," in
            *,docs,*) echo "docs_only=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "docs_only=false" >> "$GITHUB_OUTPUT" ;;
          esac

          # label: ci — 仅 workflow，校验 YAML 语法
          case ",$LABELS," in
            *,ci,*) echo "ci_only=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "ci_only=false" >> "$GITHUB_OUTPUT" ;;
          esac

          echo "tier=$TIER docs_only=$docs_only ci_only=$ci_only"

  # ============================================================
  # 所有代码 PR 必跑：fmt + clippy + 单元测试（Linux，快）
  # ============================================================
  lint-test:
    name: Lint + Test (Tier ${{ needs.meta.outputs.tier }})
    needs: meta
    if: github.actor != 'BG4JTS' && github.actor != 'oneinitAI' && needs.meta.outputs.docs_only == 'false' && needs.meta.outputs.ci_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable # 官方设计为分支引用（@stable），无法 pin SHA
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --verbose

  # ============================================================
  # Tier M/L 追加：完整 release 构建
  # ============================================================
  build:
    name: Release Build (Tier ${{ needs.meta.outputs.tier }})
    needs: meta
    if: github.actor != 'BG4JTS' && github.actor != 'oneinitAI' && needs.meta.outputs.docs_only == 'false' && needs.meta.outputs.ci_only == 'false' && (needs.meta.outputs.tier == 'M' || needs.meta.outputs.tier == 'L')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable # 分支引用，无法 pin SHA
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo build --release

  # ============================================================
  # Tier L 追加：跨平台交叉检查（win/mac 目标编译验证）
  # ============================================================
  cross-check:
    name: Cross-Check ${{ matrix.target }}
    needs: meta
    if: github.actor != 'BG4JTS' && github.actor != 'oneinitAI' && needs.meta.outputs.docs_only == 'false' && needs.meta.outputs.ci_only == 'false' && needs.meta.outputs.tier == 'L'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable # 分支引用，无法 pin SHA
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo check --target ${{ matrix.target }}

  # ============================================================
  # label: ci — 校验所有 workflow YAML 语法
  # ============================================================
  workflow-check:
    name: Workflow YAML Check
    needs: meta
    if: github.actor != 'BG4JTS' && github.actor != 'oneinitAI' && needs.meta.outputs.ci_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: |
          python - <<'EOF'
          import glob, sys, yaml
          files = glob.glob(".github/workflows/*.yml")
          for f in files:
              yaml.safe_load(open(f, encoding="utf-8"))
          print(f"OK: {len(files)} workflow(s) parse")
          EOF

  # ============================================================
  # label: docs — 校验 markdown 相对链接
  # ============================================================
  docs-check:
    name: Docs Link Check
    needs: meta
    if: github.actor != 'BG4JTS' && github.actor != 'oneinitAI' && needs.meta.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          python - <<'EOF'
          import pathlib, re, sys
          errors = []
          for md in pathlib.Path(".").rglob("*.md"):
              if ".git" in str(md): continue
              text = md.read_text(encoding="utf-8", errors="replace")
              for m in re.finditer(r"\[[^\]]*\]\(([^)#]+)(?:#[^)]*)?\)", text):
                  link = m.group(1).strip()
                  if link.startswith(("http", "mailto:", "#")): continue
                  target = md.parent / link
                  if not target.exists():
                      errors.append(f"{md}: broken link {link}")
          if errors:
              print("\n".join(errors)); sys.exit(1)
          print("docs links OK")
          EOF

  # ============================================================
  # 总闸：所有 applicable 检查通过才合并（跳过视为通过——作者豁免依赖此逻辑）
  # ============================================================
  status:
    name: All Checks Passed
    needs: [meta, lint-test, build, cross-check, workflow-check, docs-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate
        env:
          META: ${{ needs.meta.result }}
          LINT: ${{ needs.lint-test.result }}
          BUILD: ${{ needs.build.result }}
          CROSS: ${{ needs.cross-check.result }}
          WF: ${{ needs.workflow-check.result }}
          DOCS: ${{ needs.docs-check.result }}
        run: |
          ok=1
          for r in "$LINT" "$BUILD" "$CROSS" "$WF" "$DOCS"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then ok=0; fi
          done
          if [ "$META" = "failure" ] || [ "$META" = "cancelled" ]; then ok=0; fi
          if [ $ok -eq 1 ]; then
            echo "All applicable checks passed"
          else
            echo "::error::A required check failed"
            exit 1
          fi
