name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_npm:
        description: "Publish to npm (manual — CI never auto-publishes npm)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write

jobs:
  # ============================================================
  # Build binaries for all platforms
  # ============================================================
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            binary: oneinit.exe
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            binary: oneinit
          # macOS x86_64 (Intel)
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            binary: oneinit
          # macOS aarch64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            binary: oneinit

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable # 分支引用，无法 pin SHA
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-$(git describe --tags --always)}"
          # 资产命名与 self_update.rs::platform_asset / 配方 CI 一致：
          #   oneinit-<tag>-<os>-<arch>.<ext>
          case "${{ matrix.target }}" in
            x86_64-pc-windows-msvc)   OS_ARCH="windows-x86_64"; EXT="zip" ;;
            x86_64-unknown-linux-gnu) OS_ARCH="linux-x86_64";   EXT="tar.gz" ;;
            x86_64-apple-darwin)       OS_ARCH="macos-x86_64";   EXT="tar.gz" ;;
            aarch64-apple-darwin)      OS_ARCH="macos-aarch64";  EXT="tar.gz" ;;
            *) echo "::error::unsupported target: ${{ matrix.target }}"; exit 1 ;;
          esac
          ARCHIVE_NAME="oneinit-${VERSION}-${OS_ARCH}"
          BINARY="target/${{ matrix.target }}/release/${{ matrix.binary }}"

          mkdir -p "$ARCHIVE_NAME"
          cp "$BINARY" "$ARCHIVE_NAME/"
          cp README.md "$ARCHIVE_NAME/" 2>/dev/null || true
          cp LICENSE "$ARCHIVE_NAME/" 2>/dev/null || true

          if [ "$EXT" = "zip" ]; then
            # windows-latest 自带 PowerShell；Compress-Archive 比 7z 更稳定
            powershell -NoProfile -Command "Compress-Archive -Path '$ARCHIVE_NAME' -DestinationPath '$ARCHIVE_NAME.zip'"
          else
            tar -czf "${ARCHIVE_NAME}.tar.gz" "$ARCHIVE_NAME"
          fi

          echo "ARCHIVE_FILE=${ARCHIVE_NAME}.${EXT}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oneinit-${{ matrix.target }}
          path: oneinit-*.${{ matrix.archive }}

  # ============================================================
  # Create GitHub Release with all binaries（仅 tag 触发；手动触发只构建不发布）
  # ============================================================
  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # 需要完整历史以生成 changelog
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Generate release notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo '')"

          # 变更列表：上一 tag 到本次，去掉 merge commit
          if [ -n "$PREV_TAG" ]; then
            CHANGES="$(git log --oneline --no-merges "${PREV_TAG}..HEAD" 2>/dev/null | head -60)"
          else
            CHANGES="$(git log --oneline --no-merges -20 2>/dev/null)"
          fi
          [ -z "$CHANGES" ] && CHANGES="- Initial release"

          # 提取安全修复条目（commit message 含 security/harden 等）
          SECURITY="$(printf '%s\n' "$CHANGES" | grep -iE 'security|harden|CVE|vuln' || true)"

          {
            echo "## 🚀 OneInit $VERSION"
            echo ""
            echo "### 🔒 安全修复 / Security Fixes"
            if [ -n "$SECURITY" ]; then
              printf '%s\n' "$SECURITY" | sed 's/^/- /'
            else
              echo "- 本次无安全相关变更 / No security changes in this release."
            fi
            echo ""
            echo "### 📝 更新日志 / Changelog"
            printf '%s\n' "$CHANGES" | sed 's/^/- /'
            echo ""
            echo "### 📦 安装 / Install"
            echo "- npm: \`npm install -g oneinit@$VERSION\`"
            echo "- 一键脚本: \`curl -fsSL https://raw.githubusercontent.com/oneinitAI/oneinit/main/install.sh | sh\`"
            echo "- 源码: \`git clone https://github.com/oneinitAI/oneinit.git && cargo build --release\`"
            echo ""
            echo "### 🔗 链接 / Links"
            echo "- npm: https://www.npmjs.com/package/oneinit"
            echo "- 官网: https://oneinit.bg4jts.cn"
            echo "- 下载: 见下方 Assets"
          } > RELEASE_BODY.md

          echo "===== release body ====="
          cat RELEASE_BODY.md

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd artifacts
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum * > SHA256SUMS.txt
          else
            shasum -a 256 * > SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Publish to npm（仅 tag 触发）
  # ============================================================
  npm:
    name: Publish to npm
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Download Windows binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oneinit-x86_64-pc-windows-msvc
          path: npm/bin/native/

      - name: Download Linux binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oneinit-x86_64-unknown-linux-gnu
          path: npm/bin/native/

      - name: Download macOS x86_64 binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oneinit-x86_64-apple-darwin
          path: npm/bin/native/

      - name: Download macOS aarch64 binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: oneinit-aarch64-apple-darwin
          path: npm/bin/native/

      - name: Prepare npm package
        shell: bash
        run: |
          # Extract all binaries into npm/bin/native/
          cd npm/bin/native
          for f in *.zip; do
            [ -f "$f" ] && unzip -o "$f" && rm "$f"
          done
          for f in *.tar.gz; do
            [ -f "$f" ] && tar -xzf "$f" && rm "$f"
          done
          # Move binaries from subdirs to native/
          find . -name "oneinit*" -type f -exec mv {} . \;
          find . -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} \; 2>/dev/null || true
          ls -lh .

      - name: Update postinstall for multi-platform
        run: |
          cat > npm/bin/postinstall.js << 'POSTINSTALL_EOF'
          const fs = require("fs");
          const path = require("path");
          const { execFileSync } = require("child_process");

          const platform = process.platform;
          const arch = process.arch;

          // Map npm platform/arch to our binary naming
          const platformMap = {
            "win32-x64": "oneinit.exe",
            "linux-x64": "oneinit",
            "darwin-x64": "oneinit",
            "darwin-arm64": "oneinit",
          };

          const key = `${platform}-${arch}`;
          const binaryName = platformMap[key];

          if (!binaryName) {
            console.log(`[oneinit] Unsupported platform: ${key}`);
            console.log(`[oneinit] Build from source: https://github.com/oneinitAI/oneinit`);
            process.exit(0);
          }

          const binDir = path.join(__dirname, "native");
          fs.mkdirSync(binDir, { recursive: true });

          const bundled = path.join(__dirname, binaryName);
          const dest = path.join(binDir, binaryName);

          if (fs.existsSync(bundled)) {
            fs.copyFileSync(bundled, dest);
            if (platform !== "win32") fs.chmodSync(dest, 0o755);
            console.log(`[oneinit] Binary installed for ${key}.`);
          } else {
            console.log(`[oneinit] Binary for ${key} not bundled in this package.`);
            console.log(`[oneinit] Build from source: https://github.com/oneinitAI/oneinit`);
          }
          POSTINSTALL_EOF

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd npm
          # 版本号与 tag 一致即可；package.json 已是该版本时 npm 会报
          # "Version not changed"，属于正常情况，跳过即可。
          CURRENT=$(node -p "require('./package.json').version")
          if [ "$CURRENT" != "$VERSION" ]; then
            npm version "$VERSION" --no-git-tag-version --allow-scripts
          else
            echo "package.json already at $VERSION"
          fi
          echo "Publishing version: $VERSION"

      - name: Copy LICENSE and README
        run: |
          cp LICENSE npm/ 2>/dev/null || true

      - name: Publish to npm
        run: |
          cd npm
          # Determine tag (beta/rc -> beta, else latest)
          if echo "$GITHUB_REF_NAME" | grep -qE "beta|rc"; then
            TAG="beta"
          else
            TAG="latest"
          fi
          echo "Publishing with tag: $TAG"
          npm publish --tag "$TAG" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
