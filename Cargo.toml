[package]
name = "oneinit"
version = "0.1.0"
edition = "2024"
description = "One command to init your dev machine — AI-first environment initializer"
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/BG4JTS/oneinit"
keywords = ["dev-tools", "environment", "initializer", "cli", "ai"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
indicatif = "0.18"
thiserror = "2"
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
winapi = { version = "0.3", features = ["winuser", "winnt"] }

[profile.release]
lto = true
strip = true
