[package]
name = "oneinit"
version = "0.1.0"
edition = "2024"
description = "One command to init your dev machine — AI-first environment initializer"
license = "MIT"
readme = "README.md"
repository = "https://github.com/zhaozihan/oneinit"
keywords = ["dev-tools", "environment", "initializer", "cli", "ai"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
indicatif = "0.18"

[profile.release]
lto = true
strip = true
